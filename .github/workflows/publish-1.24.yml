name: Publish PlazCode 1.24.0 verified update
on:
  push:
    branches: [codex/plazcode-publish-1.24]
    paths: [.github/workflows/publish-1.24.yml, development/1.24.0/promote.py]
permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write
concurrency:
  group: plazcode-final-1.24
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_SHA: 260dd499f10a7abdf3077fdd0352d150caa074e4
      VALIDATION_RUN: '37717606516'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful exact-source validation on all platforms
        run: |
          git diff --exit-code "$VALIDATED_SHA" -- development/1.24.0/overlay development/1.24.0/prepare.py development/1.24.0/package.py
          mkdir ci-artifacts
          for attempt in $(seq 1 80); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > ci-artifacts/run.json
            state=$(python3 -c 'import json; print(json.load(open("ci-artifacts/run.json"))["status"])')
            if [ "$state" = completed ]; then break; fi
            sleep 30
          done
          python3 -c 'import json,os; r=json.load(open("ci-artifacts/run.json")); assert r["head_sha"]==os.environ["VALIDATED_SHA"] and r["status"]=="completed" and r["conclusion"]=="success"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN/jobs" > ci-artifacts/jobs.json
          for platform in Windows macOS; do
            gh run download "$VALIDATION_RUN" --repo "$GITHUB_REPOSITORY" --name "plazcode-1.24-$platform-validation" --dir "ci-artifacts/plazcode-1.24-$platform-validation"
          done
      - name: Assemble immutable archives and compact feeds
        run: |
          python3 development/1.24.0/promote.py
          python3 test-release-feed.py
          python3 test-release-notes.py
      - name: Attest final release archives
        id: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            PlazCode-1.24.0.zip
            PlazCode-macOS-1.24.0.zip
            PlazCode-source-1.24.0.zip
            PlazCode-Firefox-1.24.0.zip
      - name: Push the GitHub update in the established format
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" PlazCode-1.24.0.sigstore.json
          for file in PlazCode-1.24.0.zip PlazCode-macOS-1.24.0.zip PlazCode-source-1.24.0.zip PlazCode-Firefox-1.24.0.zip; do gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"; done
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PlazCode-1.24.0.zip PlazCode-macOS-1.24.0.zip PlazCode-source-1.24.0.zip PlazCode-Firefox-1.24.0.zip PlazCode-1.24.0.sigstore.json latest.json latest-macos.json release-notes.json release-metadata.json release-description-1.24.0.txt README.md release-validation-1.24.0 development/1.24.0/REVIEW.md
          git commit -m 'Release PlazCode 1.24.0: automatic shared workflows and reliable updates'
          git push origin HEAD:main
      - name: Publish the verified GitHub release
        run: |
          export GITHUB_SHA=$(git rev-parse HEAD)
          python3 publish_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plazcode-final-1.24-evidence
          path: |
            release-validation-1.24.0/*
            release-metadata.json
          if-no-files-found: warn
